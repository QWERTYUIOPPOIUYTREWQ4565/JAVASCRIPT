<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Card</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-slate-950 flex items-center justify-center p-6">
    <article class="w-full max-w-sm overflow-hidden rounded-2xl bg-slate-900 shadow-xl shadow-black/40">
        <div class="h-28 bg-gradient-to-r from-indigo-500 to-purple-600"></div>
        <div class="px-6 pb-6 text-center">
            <img
                class="mx-auto -mt-14 h-28 w-28 rounded-full border-4 border-white object-cover shadow-md"
                src="https://i.pravatar.cc/200?img=12"
                alt="Alex Johnson"
            >
            <h1 class="mt-4 text-2xl font-bold text-white">Alex Johnson</h1>
            <p class="text-sm font-medium text-indigo-600">Frontend Developer</p>
            <p class="mt-3 text-sm leading-relaxed text-slate-300">
                Building accessible and beautiful web experiences with modern technologies.
            </p>
            <div class="mt-5 flex justify-center gap-3">
                <button class="rounded-lg bg-indigo-600 px-5 py-2 text-sm font-semibold text-white transition hover:bg-indigo-700">
                    Follow
                </button>
                <button class="rounded-lg border border-slate-700 px-5 py-2 text-sm font-semibold text-slate-200 transition hover:bg-slate-800">
                    Message
                </button>
            </div>
        </div>
    </article>
    <script src="fetchAPI_card_project.js"></script>
</body>
</html>
